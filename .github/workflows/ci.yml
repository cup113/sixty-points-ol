name: CI

# main 分支与 v* 标签推镜像；PR 只校验 + 试构建（不推送）；也支持手动触发
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # 先跑引擎测试 / 前端纯函数测试 / 类型与 svelte-check，全绿才允许出镜像
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # 不写 version：读根 package.json 的 packageManager，避免与 Dockerfile 里的 pnpm 版本漂移
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:bot
      - run: pnpm test:web
      - run: pnpm test:mcp
      - run: pnpm check
      # 端到端：跑**构建产物**。
      # MCP 那条：两条传输（stdio 真 spawn + /api/mcp）各打一整副，
      # 顺带守住「产物里 external 化的 MCP SDK 在运行期可解析」——
      # 也就是 Dockerfile 运行阶段那份 node_modules 布局是否真的够用。
      # 机器人那条：1 人 + 2 机器人打两副（中途踢/补一轮），延迟调零以免 CI 干等。
      - run: pnpm build
      - name: 端到端（MCP 两条传输 + 机器人座位）
        run: |
          SIXTY_DB="$PWD/data/ci.db" PORT=5178 \
            SIXTY_BOT_DELAY_MIN_MS=0 SIXTY_BOT_DELAY_MAX_MS=0 \
            node apps/web/build/index.js > /tmp/sixty-server.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -fsS http://127.0.0.1:5178/ >/dev/null 2>&1 && break
            sleep 0.5
          done
          if ! curl -fsS http://127.0.0.1:5178/ >/dev/null; then
            echo "服务端没起来，日志如下："
            cat /tmp/sixty-server.log
            exit 1
          fi
          BASE=http://127.0.0.1:5178 pnpm mcp-check
          BASE=http://127.0.0.1:5178 pnpm bot-check
      # 音乐代理（ADR-0019）：脚本自己起**构建产物**与一个假边车（不出网、不需要真账号），
      # 守白名单 / Origin / 会话 cookie / 失败收敛 / SIXTY_MUSIC=off 这五件事。
      - run: pnpm music-check

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # type=gha 缓存需要 docker-container driver，必须显式建 builder
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 单架构公开镜像，不要 attestation 造成的 unknown/unknown 平台条目；
          # 需要供应链信息时改成 provenance: mode=max 并加 sbom: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
