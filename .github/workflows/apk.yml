name: Android APK (Capacitor)

# 把线上站点包成一个 Android 安装包（Capacitor 壳，见 ADR-0027）。
#
# 两种触发：
#   - 手动（workflow_dispatch）：需要**这一份部署的实际地址**，那不是能写死的常量；
#   - 推 `v*` 标签：地址取仓库变量 SIXTY_SERVER_URL，发版时自动出一个包。
# 都不在 pull_request 上跑：fork 拿不到 secret，PR 里也不该产出可安装的包。
#
# 产物：sixty-<版本>.apk（直装）。不产出 .aab —— 本期不上 Play。
on:
  workflow_dispatch:
    inputs:
      url:
        description: '站点地址（如 https://game.example.com，必须公网 HTTPS 可达）'
        required: true
        type: string
      version_name:
        description: 'versionName；留空 = run-<短 sha>'
        required: false
        type: string
      version_code:
        description: 'versionCode（整数，只增不减）；留空 = 按 UTC 的 yymmddhh 生成'
        required: false
        type: string
      release_tag:
        description: '可选：把产物挂到这个 Release（不存在则创建）'
        required: false
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

# 仓库变量（Settings → Secrets and variables → Actions → Variables）。都不是秘密：
#   SIXTY_SERVER_URL    标签构建用的站点地址（手动触发时可填，此处可留空）
#   ANDROID_KEY_ALIAS   密钥别名 —— 它是 keystore **里面**的一个标签，可推导，所以不是秘密
#   ANDROID_CERT_SHA256 签名证书的 SHA-256 指纹 —— 公开信息，钉住它，CI 才能在换钥匙时当场发现
jobs:
  apk:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SIXTY_SERVER_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_tag: ${{ steps.norm.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7

      # 输入一律经 env 传进 shell：直接 `${{ inputs.x }}` 插值进脚本等于把
      # 用户输入当代码执行（GitHub 明确警告的那一类注入）。
      - name: 规范化输入
        id: norm
        env:
          URL_INPUT: ${{ inputs.url }}
          VERSION_NAME_INPUT: ${{ inputs.version_name }}
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          URL_VAR: ${{ vars.SIXTY_SERVER_URL }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          url="${URL_INPUT:-${URL_VAR:-}}"
          url="${url%/}"
          if [ -z "$url" ]; then
            echo "::error::没有站点地址：手动触发请填 url，标签构建请配仓库变量 SIXTY_SERVER_URL"
            exit 1
          fi
          # 壳只走 https（capacitor.config.ts 里 cleartext: false），这里也把 http 拦掉
          if ! printf '%s' "$url" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[^[:space:]]*)?$'; then
            echo "::error::url 必须是 https:// 开头的地址：$url"
            exit 1
          fi
          version_name="${VERSION_NAME_INPUT:-run-${GITHUB_SHA::7}}"
          # yymmddhh：8 位、远小于 Play 的上限 2100000000，且随时间单调。
          # 同一小时内重跑会拿到**相同**的 versionCode —— Android 只在更小时拒绝安装
          # （INSTALL_FAILED_VERSION_DOWNGRADE），相同是可以覆盖安装的；要上 Play 才必须严格递增。
          version_code="${VERSION_CODE_INPUT:-$(date -u +%y%m%d%H)}"
          if ! printf '%s' "$version_code" | grep -Eq '^[0-9]+$'; then
            echo "::error::versionCode 必须是整数：$version_code"
            exit 1
          fi
          release_tag="${RELEASE_TAG_INPUT:-}"
          if [ -z "$release_tag" ] && [ "$REF_TYPE" = "tag" ]; then
            release_tag="$REF_NAME"
          fi
          {
            echo "url=$url"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

      # Capacitor 8 的 Android 工程要 JDK 21（AGP 8.13）；node 24 是 Capacitor 8 的下限
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 签名材料的分类（都别搞反）：
      #   secret  —— keystore 文件、store 口令、key 口令：泄露就等于别人能发你的更新
      #   非秘密 —— 别名（keystore 里的一个标签）、证书指纹（公开信息）
      # 口令只经环境变量与 `-storepass:env` 走，**不进 argv**（`-storepass xxx` 在进程列表里看得见）。
      # keystore 落在 $RUNNER_TEMP（工作区之外），所以任何 upload-artifact 通配都扫不到它。
      - name: 准备签名材料
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'sixty' }}
          EXPECTED_FINGERPRINT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/apk-signing"
          mkdir -p "$work"
          echo "WORK=$work" >> "$GITHUB_ENV"

          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "使用仓库 secret 里的 keystore（指纹稳定，可以做覆盖升级）"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$work/android.keystore"
            : "${KEYSTORE_PASSWORD:?配了 ANDROID_KEYSTORE_B64 就必须同时配 ANDROID_KEYSTORE_PASSWORD}"
            : "${KEY_PASSWORD:?配了 ANDROID_KEYSTORE_B64 就必须同时配 ANDROID_KEY_PASSWORD}"
            ks_pass="$KEYSTORE_PASSWORD"
            key_pass="$KEY_PASSWORD"
          else
            echo "::warning::没有配置 ANDROID_KEYSTORE_B64：本次现场生成一次性 keystore。"
            echo "::warning::它的指纹每次都不一样，装上去的包互相覆盖不了 —— 只适合试装。"
            echo "::warning::正式分发请配好那三个 secret（见 apps/mobile/README.md）。"
            ks_pass="$(openssl rand -hex 16)"
            key_pass="$ks_pass"
            KS_PASS="$ks_pass" keytool -genkeypair -v \
              -keystore "$work/android.keystore" -storetype PKCS12 \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass:env KS_PASS \
              -dname "CN=sixty-points-ol, OU=adhoc, O=adhoc, C=CN" >/dev/null 2>&1
          fi

          # 指纹：读的是证书本身，不是我们的参数（参数填错也照样读得出真指纹）
          fingerprint="$(KS_PASS="$ks_pass" keytool -list -v \
            -keystore "$work/android.keystore" \
            -storepass:env KS_PASS | grep -oE '([0-9A-F]{2}:){31}[0-9A-F]{2}' | head -n 1)"
          if [ -z "$fingerprint" ]; then
            echo "::error::没能从 keystore 读出 SHA-256 指纹"
            exit 1
          fi
          echo "SHA-256 指纹：$fingerprint"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

          # 钉住指纹：第一次发布时它还是空的（得先有一次签名的产物才知道），那时只提醒；
          # 一旦设了就硬断言 —— 换了钥匙的包照样装得上，却永远升级不了已装的那份，
          # 而这件事只在发布当天才会被发现。
          expected="$(printf '%s' "${EXPECTED_FINGERPRINT:-}" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          actual="$(printf '%s' "$fingerprint" | tr -d ':[:space:]')"
          if [ -z "$expected" ]; then
            echo "::warning::仓库变量 ANDROID_CERT_SHA256 还没设：把 $fingerprint 填进去，"
            echo "::warning::下次换钥匙时 CI 才会当场发现（而不是发出去之后）。"
          elif [ "$expected" != "$actual" ]; then
            echo "::error::签名指纹与仓库变量 ANDROID_CERT_SHA256 不一致 —— 这个包装不到已有的安装上。"
            echo "::error::  期望：$expected"
            echo "::error::  实际：$actual"
            exit 1
          else
            echo "指纹与仓库变量 ANDROID_CERT_SHA256 一致"
          fi

          {
            echo "SIXTY_KEYSTORE_PATH=$work/android.keystore"
            echo "SIXTY_KEYSTORE_PASSWORD=$ks_pass"
            echo "SIXTY_KEY_PASSWORD=$key_pass"
            echo "SIXTY_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      # `cap sync` 把 capacitor.config.ts（此处注入了站点地址）与 www/ 写进 android 工程；
      # 不跑它，Gradle 拿到的是仓库里那份缺省域名。
      - name: 写壳的地址并同步 android 工程
        env:
          SIXTY_SERVER_URL: ${{ steps.norm.outputs.url }}
        run: |
          set -euo pipefail
          pnpm --filter mobile run sync
          grep -F "\"url\": \"$SIXTY_SERVER_URL\"" apps/mobile/android/app/src/main/assets/capacitor.config.json \
            || { echo "::error::sync 之后 assets/capacitor.config.json 里的地址不是 $SIXTY_SERVER_URL"; exit 1; }

      # 版本号与口令都经环境变量进 Gradle；--no-daemon 不能省：daemon 会带着**首次启动时**
      # 的环境变量活下来，后面步骤设的 versionCode / 口令就不一定生效了。
      - name: 构建 release APK
        env:
          SIXTY_VERSION_CODE: ${{ steps.norm.outputs.version_code }}
          SIXTY_VERSION_NAME: ${{ steps.norm.outputs.version_name }}
        run: |
          set -euo pipefail
          chmod +x apps/mobile/android/gradlew
          apps/mobile/android/gradlew -p apps/mobile/android :app:assembleRelease --no-daemon

      # 验产物而不是验绿勾：签的是谁的证书、包名与 versionCode 是不是本次输入的那个。
      # 工具不在就直接跳过并说清楚（runner 上有没有 apksigner/aapt2 不该让整条流水线红）。
      - name: 核对产物（签名者 / 包名 / versionCode）
        env:
          VERSION_CODE: ${{ steps.norm.outputs.version_code }}
        run: |
          set -euo pipefail
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk" || { echo "::error::没有产出 release APK"; exit 1; }
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          pick() { ls -d "$sdk"/build-tools/*/"$1" 2>/dev/null | sort -V | tail -n 1 || true; }

          signer="$(pick apksigner)"
          if [ -z "$signer" ]; then
            echo "::warning::runner 上没有 apksigner，跳过「这份 APK 是谁签的」核对"
          else
            certs="$("$signer" verify --print-certs "$apk")"
            printf '%s\n' "$certs"
            if printf '%s' "$certs" | grep -qi 'Android Debug'; then
              echo "::error::这是 debug 签名：它永远升不了级，不能发出去"
              exit 1
            fi
          fi

          badging_bin="$(pick aapt2)"
          if [ -z "$badging_bin" ]; then
            echo "::warning::runner 上没有 aapt2，跳过包名/版本核对"
          else
            first_line="$("$badging_bin" dump badging "$apk" | head -n 1)"
            printf '%s\n' "$first_line"
            printf '%s' "$first_line" | grep -q "name='io.github.cup113.sixty'" \
              || { echo "::error::APK 的包名不是 io.github.cup113.sixty"; exit 1; }
            printf '%s' "$first_line" | grep -q "versionCode='$VERSION_CODE'" \
              || { echo "::error::APK 的 versionCode 不是 $VERSION_CODE"; exit 1; }
          fi

      # 壳指向的地址必须是活的：壳本身没有离线能力（对局在服务端），
      # 打一个到死站的包，用户装上只会看到 offline.html。
      - name: 站点可达吗
        env:
          URL: ${{ steps.norm.outputs.url }}
        run: |
          if curl -fsS --max-time 20 -o /dev/null "$URL/"; then
            echo "$URL 可达"
          else
            echo "::warning::$URL 现在取不到。包仍可用，但用户装上只会看到 offline.html。"
          fi

      - name: 收进 dist 并写一份指纹备忘
        env:
          URL: ${{ steps.norm.outputs.url }}
          FINGERPRINT: ${{ steps.sign.outputs.fingerprint }}
          VERSION_NAME: ${{ steps.norm.outputs.version_name }}
          VERSION_CODE: ${{ steps.norm.outputs.version_code }}
        run: |
          set -euo pipefail
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          ls -l "$apk"
          mkdir -p dist
          cp "$apk" "dist/sixty-$VERSION_CODE.apk"
          {
            echo "# 六十分 APK 构建信息"
            echo
            echo "- 站点：$URL"
            echo "- 包名：io.github.cup113.sixty"
            echo "- SHA-256 指纹：\`$FINGERPRINT\`"
            echo "- versionName：$VERSION_NAME（versionCode $VERSION_CODE）"
            echo "- 提交：$GITHUB_SHA"
            echo
            echo "覆盖升级靠同一把钥匙：换钥匙之前装过的版本将永远升不上来。"
            echo "仓库变量要钉的一行（下一次换钥匙时 CI 才会当场发现）："
            echo '```'
            echo "ANDROID_CERT_SHA256=$FINGERPRINT"
            echo '```'
          } > dist/BUILD-INFO.md
          cat dist/BUILD-INFO.md

      - uses: actions/upload-artifact@v5
        with:
          name: sixty-apk
          path: dist/*
          if-no-files-found: error

      # keystore 与工程都不留在 runner 的磁盘上（$RUNNER_TEMP 之外还有缓存与日志）
      - name: 清理签名材料
        if: always()
        run: rm -rf "${RUNNER_TEMP}/apk-signing"

  # 单独的作业才拿得到 contents: write —— 只有真要挂 Release 时才跑
  attach:
    needs: apk
    if: needs.apk.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: sixty-apk
          path: dist
      - name: 挂到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.apk.outputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 标签触发时 Release 可能还不存在：建一个只有 APK 的，别去改已有说明
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "$TAG" \
              --notes "六十分 $TAG 的 Android 安装包（Capacitor 壳）。签名指纹见 BUILD-INFO.md。"
          fi
          gh release upload "$TAG" --repo "$REPO" dist/* --clobber
