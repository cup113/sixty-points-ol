# 六十分 —— 一键部署
#   docker compose up -d --build              # 直接跑在 3000 端口
#   DOMAIN=game.example.com docker compose --profile https up -d --build   # 带自动 HTTPS（需 80/443 与域名解析）
#
# Coolify：直接用它添加本仓库的 compose 资源即可；域名端口填容器端口 3000
# （Domain 里的端口是“容器端口”，不是公网端口）。

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sixty-points-ol:latest
    restart: unless-stopped
    environment:
      # 形如 ${X:-默认值} 的写法在 Coolify 面板里可直接编辑
      - PORT=${PORT:-3000}
      - HOST=${HOST:-0.0.0.0}
      - SIXTY_DB=${SIXTY_DB:-/data/sixty.db}
      - NODE_ENV=production
      # ⚠️ 不要写 ORIGIN=${ORIGIN:-}：宿主未设置时它会注入「空字符串」，
      # adapter-node 会直接拒绝启动：Error: Invalid ORIGIN: ''.
      # 不定义 ORIGIN 时服务端按请求头推导（反代场景正是想要的行为）；
      # 确实需要绝对地址时，取消下一行注释并填完整 URL：
      # - ORIGIN=${ORIGIN:-https://game.example.com}
      #
      # Gitee 登录（ADR-0023）：留空 = 功能整体隐身（按钮不渲染、回调 404），
      # 所以这几行可以原样留着，配上值才算启用。回调地址在 Gitee 开放平台登记为
      #   https://<你的域名>/api/auth/gitee/callback
      # - SIXTY_GITEE_CLIENT_ID=${SIXTY_GITEE_CLIENT_ID:-}
      # - SIXTY_GITEE_CLIENT_SECRET=${SIXTY_GITEE_CLIENT_SECRET:-}
      # 可选：state 的 HMAC 密钥（不设则从 client secret 派生；想让两者独立轮换再设）
      # - SIXTY_GITEE_STATE_SECRET=${SIXTY_GITEE_STATE_SECRET:-}
      #
      # 管理员名单（ADR-0024）：逗号分隔的 Gitee 数字 id；留空 = 没有管理员（/admin 一律 404）。
      # 只有这些 Gitee 身份能进 /admin，本地身份永远不是管理员。
      # - SIXTY_ADMIN_GITEE_IDS=${SIXTY_ADMIN_GITEE_IDS:-}
    volumes:
      # 牌局、身份、事件日志都在这里；容器重建不丢
      - sixty-data:/data
    ports:
      - '${PUBLIC_PORT:-3000}:${PORT:-3000}'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      # SSE（text/event-stream）最怕中间层 gzip/缓冲：Coolify 会注入 gzip 中间件，
      # 这行把它关掉，否则页面正常但实时推送永远不来。应用侧已带 X-Accel-Buffering: no。
      - 'traefik.http.middlewares.gzip.compress=false'
    # Coolify 自动域名（可选）：把 <hostname> 换成你自己的域名
    # environment 里再加一行即可：
    #   - SERVICE_FQDN_APP_3000=<hostname>

  # 可选：自带 HTTPS 的反向代理，启用方式 docker compose --profile https up -d
  # Caddy 会自动申请并续期证书；SSE 路径单独设置 flush_interval -1 关闭缓冲。
  caddy:
    image: caddy:2-alpine
    profiles: ['https']
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      # 默认 localhost：直接 --profile https 也能起（Caddy 用本地 CA 签本地证书）；
      # 公网部署时用 DOMAIN=game.example.com 覆盖。
      - DOMAIN=${DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  sixty-data:
  caddy-data:
  caddy-config:
